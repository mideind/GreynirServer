[project]
name = "greynir-server"
# GreynirServer is deployed from a git checkout, not published to an index, so
# this version is not currently meaningful to anything -- the running versions
# reported in the UI come from GreynirEngine and Tokenizer.
version = "1.0.0"
description = "Web API and frontend for Greynir, natural language processing for Icelandic"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Miðeind ehf." }]

dependencies = [
    # Flask
    "werkzeug>=2.3.7",
    "Flask==2.3.3",
    "flask-caching>=2.3.1",
    "Flask-Cors>=5.0.1",
    # DB
    #
    # psycopg2 is the C driver and is what db/__init__.py prefers. It was not
    # usable while production ran PyPy, which is the only reason the cffi port
    # was ever here. Built from source rather than psycopg2-binary, as upstream
    # advises for production: the binary wheel bundles its own libpq and libssl,
    # and this process also runs gevent and TLS against a second OpenSSL.
    "psycopg2>=2.9.12",
    # Kept as the fallback for vectors/venv, which is stuck on CPython 3.9 by
    # gensim and installs from vectors/requirements.txt. Harmless in the 3.14
    # environments, where psycopg2 wins the detection in db/__init__.py.
    "psycopg2cffi==2.9.0",
    "SQLAlchemy==1.4.54",
    # Server
    "gevent>=24.2.1",
    # Every web unit is ExecStart=$DEST/venv/bin/gunicorn, but gunicorn was
    # declared nowhere -- production carried a hand-installed 21.2.0 that no
    # file recorded, so a venv built from this file alone had no gunicorn at all.
    #
    # >=22.0.0 is a security floor, not a preference: 21.2.0 has CVE-2024-1135
    # and CVE-2024-6827, both HTTP request smuggling, both fixed in 22.0.0.
    # Production had been running it for as long as it has been installed by
    # hand; declaring the dependency is what finally surfaced it to Dependabot.
    "gunicorn>=22.0.0",
    "setuptools>=67",
    # Util
    "cachetools>=5.5.2",
    "requests>=2.32.3",
    "typing-extensions>=4.13.2",
    "python-dotenv>=1.1.0",
    # Scraping
    "beautifulsoup4==4.13.4",
    "feedparser==6.0.11",
    # Query modules
    "pytz==2025.2",
    "timezonefinder==6.5.9",
    "rjsmin>=1.2.4",
    "python-youtube==0.9.1",
    "country-list>=1.1.0",
    # For OpenAI GPT support. Icespeak requires openai>=1.44, so the old
    # <1.40 ceiling is gone; jiter, which openai pulls in from 1.40 onwards,
    # ships no PyPy wheels but does build from source on PyPy 3.11.
    "openai>=1.44",
    "httpx>=0.27.2",
    # Ours
    "reynir>=3.8.0",
    "islenska>=1.3.2",
    # Back on PyPI as of 0.4.0, which declares pydantic>=2.8,<3 instead of the
    # ==2.3.0 pin that made every release up to 0.3.7 uninstallable on 3.13+
    # (pydantic-core has no wheels past cp312). That pin is why this was
    # tracked from git master; the [tool.uv.sources] entry is gone with it.
    "icespeak>=0.4.0",
    "iceaddr>=0.5.8",
    "iceweather>=0.2.3",
    # >=0.1.3 dropped the pkg_resources import, so setuptools need not be
    # held below 82 (which removed pkg_resources) any more.
    "cityloc>=0.1.3",
    "straeto>=1.4.1",
    "numpy>=2.4.6",
]

[project.urls]
Homepage = "https://greynir.is"
Repository = "https://github.com/mideind/GreynirServer"

[dependency-groups]
# Installed by `uv sync`, excluded by `uv sync --no-dev` (i.e. in production).
dev = [
    "pytest>=8.0",
    "curlylint>=0.13",
    # Type stubs, consumed by pyright/pylance. These are never imported at
    # runtime, and sqlalchemy-stubs declares mypy as a dependency, which drags
    # in a Rust/PyO3 extension -- so keep them out of the production install.
    "sqlalchemy2-stubs>=0.0.2a38",
    "sqlalchemy-stubs>=0.4",
]

[tool.pytest.ini_options]
# Confine collection to tests/. Without this, pytest walks the whole repository
# from its rootdir, which picks up any local virtualenv or interpreter tree
# (e.g. a pypy/ or venv/ directory) and puts vendored third-party packages on
# sys.path, where they shadow the real ones. CI never hit this because its
# checkout is clean, but any developer with a local interpreter directory did.
testpaths = ["tests"]

[tool.uv]
# GreynirServer is an application, not an installable library: modules live at
# the repository root and are run in place. Tell uv to manage the environment
# without trying to build or install the project itself.
package = false
